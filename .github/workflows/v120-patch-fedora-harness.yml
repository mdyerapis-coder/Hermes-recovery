name: Patch disposable Fedora hostname harness

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v120-patch-fedora-harness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/bitwarden-smart-resume-v1.2.0-final
          fetch-depth: 0

      - name: Pre-ground disposable container and remove this helper
        run: |
          set -Eeuo pipefail
          target=.github/workflows/v120-fedora-systemd-full-install.yml
          test "$(grep -c -- '--hostname fedora-clean' "$target")" -eq 1
          test "$(grep -c 'allow_hostname_change: true' "$target")" -eq 1

          sed -i \
            -e 's/--hostname fedora-clean/--hostname hermes-station/' \
            -e 's/allow_hostname_change: true/allow_hostname_change: false/' \
            "$target"

          test "$(grep -c -- '--hostname hermes-station' "$target")" -eq 1
          test "$(grep -c 'allow_hostname_change: false' "$target")" -eq 1
          test "$(grep -c -- '--hostname fedora-clean' "$target")" -eq 0

          git rm .github/workflows/v120-patch-fedora-harness.yml
          git config user.name 'Hermes Recovery CI'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git commit -m 'ci: pre-ground disposable Fedora hostname'
          git push origin HEAD:agent/bitwarden-smart-resume-v1.2.0-final
