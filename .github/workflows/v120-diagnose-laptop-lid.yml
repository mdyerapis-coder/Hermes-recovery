name: Diagnose v1.2.0 OpenSSH stage

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v120-diagnose-laptop-lid.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Reconstruct and inspect signed controller
        run: |
          set -Eeuo pipefail
          archive=hermes-rebuild-kit-v1.2.0.tar.gz
          mapfile -t parts < <(grep -Ev '^[[:space:]]*(#|$)' payload/parts.txt)
          test "${#parts[@]}" -eq 7
          cat "${parts[@]}" | base64 --decode > "/tmp/$archive"
          (
            cd /tmp
            grep "  $archive$" "$GITHUB_WORKSPACE/SHA256SUMS" \
              | sha256sum --check --strict -
          )
          rm -rf /tmp/hermes-sshd-diagnostic
          mkdir -p /tmp/hermes-sshd-diagnostic
          tar -xzf "/tmp/$archive" -C /tmp/hermes-sshd-diagnostic
          cd /tmp/hermes-sshd-diagnostic/hermes-rebuild-kit
          sha256sum --check --strict MANIFEST.sha256
          echo '--- all OpenSSH controller references ---'
          grep -n -C 30 -E 'configure_openssh|sshd -t|ssh-keygen|HostKey|openssh' \
            bin/hermes_rebuild.py || true
          echo '--- related tests ---'
          grep -n -C 20 -E 'configure_openssh|sshd -t|ssh-keygen|HostKey|openssh' \
            tests/regression_v120_test.py tests/e2e_test.py tests/smoke_test.py \
            || true
