name: Diagnose v1.2.0 laptop lid stage

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v120-diagnose-laptop-lid.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Reconstruct and inspect signed controller
        run: |
          set -Eeuo pipefail
          archive=hermes-rebuild-kit-v1.2.0.tar.gz
          mapfile -t parts < <(grep -Ev '^[[:space:]]*(#|$)' payload/parts.txt)
          test "${#parts[@]}" -eq 7
          cat "${parts[@]}" | base64 --decode > "/tmp/$archive"
          (
            cd /tmp
            grep "  $archive$" "$GITHUB_WORKSPACE/SHA256SUMS" \
              | sha256sum --check --strict -
          )
          rm -rf /tmp/hermes-lid-diagnostic
          mkdir -p /tmp/hermes-lid-diagnostic
          tar -xzf "/tmp/$archive" -C /tmp/hermes-lid-diagnostic
          cd /tmp/hermes-lid-diagnostic/hermes-rebuild-kit
          sha256sum --check --strict MANIFEST.sha256
          echo '--- stage_laptop_lid source ---'
          start="$(grep -n -m1 'def stage_laptop_lid' bin/hermes_rebuild.py | cut -d: -f1)"
          test -n "$start"
          begin=$((start > 15 ? start - 15 : 1))
          end=$((start + 150))
          nl -ba bin/hermes_rebuild.py | sed -n "${begin},${end}p"
          echo '--- related regression coverage ---'
          grep -n -C 10 -E 'laptop_lid|laptop-lid|systemd-inhibit|FUNCTIONS=' \
            tests/regression_v120_test.py tests/e2e_test.py tests/smoke_test.py \
            || true
