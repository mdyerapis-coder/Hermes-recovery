name: v1.2.0 candidate validation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/bitwarden-smart-resume-v1.2.0-final
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v120-candidate-validation.yml'
      - 'install.sh'
      - 'SHA256SUMS'
      - 'VERSION'
      - 'payload/**'
      - 'README.md'
      - 'REGRESSION-MATRIX.md'

permissions:
  contents: read

concurrency:
  group: v120-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ARCHIVE_NAME: hermes-rebuild-kit-v1.2.0.tar.gz
  EXPECTED_PARTS: '7'

jobs:
  ubuntu-validation:
    name: Ubuntu archive, tests and adversarial loader
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Install test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Reconstruct and verify candidate archive
        id: archive
        run: |
          set -Eeuo pipefail
          mapfile -t parts < <(grep -Ev '^[[:space:]]*(#|$)' payload/parts.txt)
          test "${#parts[@]}" -eq "$EXPECTED_PARTS"
          for index in "${!parts[@]}"; do
            printf -v expected 'payload/%s.b64.part-%03d' "$ARCHIVE_NAME" "$index"
            test "${parts[$index]}" = "$expected"
            test -s "${parts[$index]}"
          done
          cat "${parts[@]}" | base64 --decode > "/tmp/$ARCHIVE_NAME"
          (
            cd /tmp
            grep "  $ARCHIVE_NAME$" "$GITHUB_WORKSPACE/SHA256SUMS" | sha256sum --check --strict -
          )
          rm -rf /tmp/hermes-rebuild-verified
          mkdir -p /tmp/hermes-rebuild-verified
          tar -xzf "/tmp/$ARCHIVE_NAME" -C /tmp/hermes-rebuild-verified
          kit=/tmp/hermes-rebuild-verified/hermes-rebuild-kit
          test "$(tr -d '[:space:]' < "$kit/VERSION")" = '1.2.0'
          (
            cd "$kit"
            sha256sum --check --strict MANIFEST.sha256
            bash -n install.sh bootstrap.sh bin/hermes-rebuildctl tests/run.sh
            sudo env PYTHONPYCACHEPREFIX=/tmp/hermes-pyc python3 -m compileall -q bin tests
            sudo ./tests/run.sh
          )
          echo "kit=$kit" >> "$GITHUB_OUTPUT"

      - name: Exercise split-payload loader
        env:
          KIT: ${{ steps.archive.outputs.kit }}
        run: |
          set -Eeuo pipefail
          sudo rm -rf /tmp/hermes-recovery-kit-ci
          sudo env \
            HERMES_RECOVERY_ALLOW_INSECURE_TEST_URL=1 \
            HERMES_RECOVERY_BASE_URL="file://${GITHUB_WORKSPACE}" \
            HERMES_RECOVERY_CHECKSUM_URL="file://${GITHUB_WORKSPACE}/SHA256SUMS" \
            HERMES_RECOVERY_CURL_RETRY=0 \
            HERMES_RECOVERY_INSTALL_BASE=/tmp/hermes-recovery-kit-ci \
            bash ./install.sh --plan --config "$KIT/templates/config.example.yaml"
          sudo test -L /tmp/hermes-recovery-kit-ci/current
          sudo test "$(sudo cat /tmp/hermes-recovery-kit-ci/current/VERSION)" = '1.2.0'

      - name: Verify fail-closed payload handling
        env:
          KIT: ${{ steps.archive.outputs.kit }}
        run: |
          set -Eeuo pipefail
          exercise_failure() {
            local name="$1" mutation="$2"
            local fixture output rc
            fixture="$(mktemp -d)"
            cp -a "$GITHUB_WORKSPACE"/. "$fixture"/
            eval "$mutation"
            set +e
            output="$(env \
              HERMES_RECOVERY_ALLOW_INSECURE_TEST_URL=1 \
              HERMES_RECOVERY_BASE_URL="file://${fixture}" \
              HERMES_RECOVERY_CHECKSUM_URL="file://${fixture}/SHA256SUMS" \
              HERMES_RECOVERY_CURL_RETRY=0 \
              HERMES_RECOVERY_INSTALL_BASE="$(mktemp -d)/install" \
              bash "$fixture/install.sh" --plan --config "$KIT/templates/config.example.yaml" 2>&1)"
            rc=$?
            set -e
            printf '%s: exit=%s\n%s\n' "$name" "$rc" "$output"
            test "$rc" -eq 65
          }
          exercise_failure missing_part 'rm -f "$fixture/payload/hermes-rebuild-kit-v1.2.0.tar.gz.b64.part-004"'
          exercise_failure empty_part ': > "$fixture/payload/hermes-rebuild-kit-v1.2.0.tar.gz.b64.part-004"'
          exercise_failure corrupt_part 'printf X >> "$fixture/payload/hermes-rebuild-kit-v1.2.0.tar.gz.b64.part-004"'
          exercise_failure wrong_order 'sed -i "4s/003/004/;5s/004/003/" "$fixture/payload/parts.txt"'

  fedora-validation:
    name: Fedora DNF5 archive and loader
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:latest
    steps:
      - name: Install Fedora test dependencies
        run: |
          dnf -y install \
            bash coreutils curl findutils git gzip python3 python3-pyyaml tar

      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Confirm DNF5 and reconstruct candidate
        id: archive
        run: |
          set -Eeuo pipefail
          dnf --version
          mapfile -t parts < <(grep -Ev '^[[:space:]]*(#|$)' payload/parts.txt)
          test "${#parts[@]}" -eq "$EXPECTED_PARTS"
          for index in "${!parts[@]}"; do
            printf -v expected 'payload/%s.b64.part-%03d' "$ARCHIVE_NAME" "$index"
            test "${parts[$index]}" = "$expected"
            test -s "${parts[$index]}"
          done
          cat "${parts[@]}" | base64 --decode > "/tmp/$ARCHIVE_NAME"
          (
            cd /tmp
            grep "  $ARCHIVE_NAME$" "$GITHUB_WORKSPACE/SHA256SUMS" | sha256sum --check --strict -
          )
          rm -rf /tmp/hermes-rebuild-fedora
          mkdir -p /tmp/hermes-rebuild-fedora
          tar -xzf "/tmp/$ARCHIVE_NAME" -C /tmp/hermes-rebuild-fedora
          kit=/tmp/hermes-rebuild-fedora/hermes-rebuild-kit
          (
            cd "$kit"
            sha256sum --check --strict MANIFEST.sha256
            ./tests/run.sh
          )
          echo "kit=$kit" >> "$GITHUB_OUTPUT"

      - name: Exercise loader under Fedora
        env:
          KIT: ${{ steps.archive.outputs.kit }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/hermes-recovery-kit-ci
          env \
            HERMES_RECOVERY_ALLOW_INSECURE_TEST_URL=1 \
            HERMES_RECOVERY_BASE_URL="file://${GITHUB_WORKSPACE}" \
            HERMES_RECOVERY_CHECKSUM_URL="file://${GITHUB_WORKSPACE}/SHA256SUMS" \
            HERMES_RECOVERY_CURL_RETRY=0 \
            HERMES_RECOVERY_INSTALL_BASE=/tmp/hermes-recovery-kit-ci \
            bash ./install.sh --plan --config "$KIT/templates/config.example.yaml"
          test -L /tmp/hermes-recovery-kit-ci/current
          test "$(cat /tmp/hermes-recovery-kit-ci/current/VERSION)" = '1.2.0'
