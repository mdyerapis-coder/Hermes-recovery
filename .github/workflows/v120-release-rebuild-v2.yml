name: v1.2.0 verified release rebuild v2

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v120-release-rebuild-v2.yml'

permissions:
  contents: write

concurrency:
  group: v120-verified-release-rebuild-v2
  cancel-in-progress: false

env:
  RELEASE_BRANCH: agent/bitwarden-smart-resume-v1.2.0-final
  ARCHIVE_NAME: hermes-rebuild-kit-v1.2.0.tar.gz
  EXPECTED_TAR_SHA256: 7987421315d90febd663290551702512c49a0d09ec3176f7e301f7b2c237d663

jobs:
  rebuild:
    name: Apply both fixes, test, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Install test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Rebuild and atomically publish verified payload
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          trap 'sudo rm -rf "$work"' EXIT
          mkdir -p "$work/source" "$work/payload" "$work/pycache"

          mapfile -t parts < <(grep -Ev '^[[:space:]]*(#|$)' payload/parts.txt)
          test "${#parts[@]}" -eq 7
          for index in "${!parts[@]}"; do
            printf -v expected 'payload/%s.b64.part-%03d' "$ARCHIVE_NAME" "$index"
            test "${parts[$index]}" = "$expected"
            test -s "${parts[$index]}"
          done
          cat "${parts[@]}" | base64 --decode > "$work/current.tar.gz"
          (
            cd "$work"
            grep "  $ARCHIVE_NAME$" "$GITHUB_WORKSPACE/SHA256SUMS" \
              | sed "s#  $ARCHIVE_NAME#  current.tar.gz#" \
              | sha256sum --check --strict -
          )
          tar -xzf "$work/current.tar.gz" -C "$work/source"
          kit="$work/source/hermes-rebuild-kit"
          (
            cd "$kit"
            sha256sum --check --strict MANIFEST.sha256
          )

          python3 - "$kit" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          bootstrap = root / "bootstrap.sh"
          text = bootstrap.read_text()

          old_root_guard = '''if [[ ${EUID:-$(id -u)} -ne 0 ]]; then
            echo "ERROR: run as root (for example: sudo ./bootstrap.sh)" >&2
            exit 77
          fi
          '''
          new_root_guard = '''if [[ ${EUID:-$(id -u)} -ne 0 ]]; then
            allow_unprivileged_plan=0
            if [[ "${HERMES_RECOVERY_ALLOW_UNPRIVILEGED_TEST:-0}" == "1" ]]; then
              for arg in "$@"; do
                if [[ "$arg" == "--plan" ]]; then
                  allow_unprivileged_plan=1
                  break
                fi
              done
            fi
            if [[ "$allow_unprivileged_plan" != "1" ]]; then
              echo "ERROR: run as root (for example: sudo ./bootstrap.sh); unprivileged test mode is restricted to --plan" >&2
              exit 77
            fi
          fi
          '''
          if text.count(old_root_guard) != 1:
              raise SystemExit("unexpected bootstrap root guard")
          text = text.replace(old_root_guard, new_root_guard)

          replacements = {
              "if command -v python3 >/dev/null 2>&1 && python3 - <<'PY' >/dev/null 2>&1":
                  "if command -v python3 >/dev/null 2>&1 && command -v openssl >/dev/null 2>&1 && python3 - <<'PY' >/dev/null 2>&1",
              "apt-get install -y --no-install-recommends python3 python3-yaml ca-certificates":
                  "apt-get install -y --no-install-recommends python3 python3-yaml ca-certificates openssl",
              "dnf install -y python3 python3-pyyaml ca-certificates":
                  "dnf install -y python3 python3-pyyaml ca-certificates openssl",
              "yum install -y python3 python3-pyyaml ca-certificates":
                  "yum install -y python3 python3-pyyaml ca-certificates openssl",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected bootstrap match count for {old!r}")
              text = text.replace(old, new)
          bootstrap.write_text(text)

          regression = root / "tests" / "regression_v120_test.py"
          text = regression.read_text()
          marker = "def test_fedora_dnf5_and_selinux_static_guards() -> None:\n"
          addition = '''def test_bootstrap_unprivileged_test_mode_is_plan_only() -> None:
              source = (ROOT / "bootstrap.sh").read_text()
              assert "HERMES_RECOVERY_ALLOW_UNPRIVILEGED_TEST" in source
              assert 'if [[ "$arg" == "--plan" ]]' in source
              assert "unprivileged test mode is restricted to --plan" in source


          def test_bootstrap_installs_openssl_before_secret_generation() -> None:
              source = (ROOT / "bootstrap.sh").read_text()
              assert "command -v openssl" in source
              assert "python3 python3-yaml ca-certificates openssl" in source
              assert "python3 python3-pyyaml ca-certificates openssl" in source


          '''
          if text.count(marker) != 1:
              raise SystemExit("unexpected regression insertion marker")
          text = text.replace(marker, addition + marker)

          main_marker = '''def main() -> None:
              test_stage_state_detection_and_resume()
          '''
          main_replacement = '''def main() -> None:
              test_stage_state_detection_and_resume()
              test_bootstrap_unprivileged_test_mode_is_plan_only()
          '''
          if text.count(main_marker) != 1:
              raise SystemExit("unexpected regression main marker")
          text = text.replace(main_marker, main_replacement)
          regression.write_text(text)
          PY

          (
            cd "$kit"
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type f ! -name MANIFEST.sha256 -printf '%P\0' \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > MANIFEST.sha256
            sha256sum --check --strict MANIFEST.sha256
            bash -n install.sh bootstrap.sh bin/hermes-rebuildctl tests/run.sh
            sudo env \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPYCACHEPREFIX="$work/pycache" \
              ./tests/run.sh
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            sha256sum --check --strict MANIFEST.sha256
          )

          (
            cd "$work/source"
            tar \
              --sort=name \
              --mtime='2026-08-05 00:00:00Z' \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --format=gnu \
              -cf "$work/release.tar" hermes-rebuild-kit
          )
          tar_sha="$(sha256sum "$work/release.tar" | awk '{print $1}')"
          printf 'deterministic tar SHA-256: %s\n' "$tar_sha"
          test "$tar_sha" = "$EXPECTED_TAR_SHA256"

          gzip -n -9 -c "$work/release.tar" > "$work/$ARCHIVE_NAME"
          archive_sha="$(sha256sum "$work/$ARCHIVE_NAME" | awk '{print $1}')"
          printf 'published archive SHA-256: %s\n' "$archive_sha"

          base64 -w0 "$work/$ARCHIVE_NAME" > "$work/$ARCHIVE_NAME.b64"
          split -b 10000 -d -a 3 \
            "$work/$ARCHIVE_NAME.b64" \
            "$work/payload/$ARCHIVE_NAME.b64.part-"
          test "$(find "$work/payload" -maxdepth 1 -type f | wc -l)" -eq 7
          cat "$work"/payload/*.part-* | base64 --decode > "$work/reconstructed.tar.gz"
          cmp "$work/$ARCHIVE_NAME" "$work/reconstructed.tar.gz"
          test "$(sha256sum "$work/reconstructed.tar.gz" | awk '{print $1}')" = "$archive_sha"

          rm -rf "$work/verify"
          mkdir -p "$work/verify"
          tar -xzf "$work/reconstructed.tar.gz" -C "$work/verify"
          (
            cd "$work/verify/hermes-rebuild-kit"
            sha256sum --check --strict MANIFEST.sha256
            sudo env \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPYCACHEPREFIX="$work/verify-pycache" \
              ./tests/run.sh
          )

          printf '%s  %s\n' "$archive_sha" "$ARCHIVE_NAME" > SHA256SUMS
          rm -f payload/$ARCHIVE_NAME.b64.part-*
          cp "$work"/payload/$ARCHIVE_NAME.b64.part-* payload/

          cat "${parts[@]}" | base64 --decode > "$work/repo-reconstruction.tar.gz"
          test "$(sha256sum "$work/repo-reconstruction.tar.gz" | awk '{print $1}')" = "$archive_sha"

          git config user.name 'Hermes Recovery CI'
          git config user.email 'actions@users.noreply.github.com'
          git add SHA256SUMS payload/$ARCHIVE_NAME.b64.part-*
          git diff --cached --check
          git commit -m 'fix: bootstrap OpenSSL and plan-only test mode'
          git push origin "HEAD:$RELEASE_BRANCH"
