name: Diagnose v1.2.0 disabled Tailscale invocation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v120-diagnose-disabled-tailscale.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Reconstruct and inspect signed controller
        run: |
          set -Eeuo pipefail
          archive=hermes-rebuild-kit-v1.2.0.tar.gz
          mapfile -t parts < <(grep -Ev '^[[:space:]]*(#|$)' payload/parts.txt)
          test "${#parts[@]}" -eq 7
          cat "${parts[@]}" | base64 --decode > "/tmp/$archive"
          (
            cd /tmp
            grep "  $archive$" "$GITHUB_WORKSPACE/SHA256SUMS" | sha256sum --check --strict -
          )
          rm -rf /tmp/hermes-tailscale-diagnostic
          mkdir -p /tmp/hermes-tailscale-diagnostic
          tar -xzf "/tmp/$archive" -C /tmp/hermes-tailscale-diagnostic
          cd /tmp/hermes-tailscale-diagnostic/hermes-rebuild-kit
          sha256sum --check --strict MANIFEST.sha256
          echo '--- all Tailscale controller references ---'
          grep -n -C 35 -E 'tailscale|tailscaled|health_checks|Health check summary|health-last' \
            bin/hermes_rebuild.py || true
          echo '--- related tests ---'
          grep -n -C 25 -E 'tailscale|health_checks|disabled' \
            tests/regression_v120_test.py tests/e2e_test.py tests/smoke_test.py || true
