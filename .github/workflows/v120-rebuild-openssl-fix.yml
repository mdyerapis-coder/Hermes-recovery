name: v1.2.0 rebuild payload with OpenSSL bootstrap fix

on:
  workflow_dispatch:
  push:
    branches:
      - agent/bitwarden-smart-resume-v1.2.0-final
    paths:
      - '.github/workflows/v120-rebuild-openssl-fix.yml'

permissions:
  contents: write

concurrency:
  group: v120-openssl-release-rebuild
  cancel-in-progress: false

env:
  RELEASE_BRANCH: agent/bitwarden-smart-resume-v1.2.0-final
  ARCHIVE_NAME: hermes-rebuild-kit-v1.2.0.tar.gz
  FIXED_MTIME: '2026-08-05 00:00:00Z'
  EXPECTED_NEW_SHA256: d020695f2215b9da0921b0afd395a0a89ac363b1a7a696c1a92e88bff967f0ab

jobs:
  rebuild:
    name: Patch, test, rebuild and atomically publish payload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Install test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Reconstruct currently published archive
        run: |
          set -Eeuo pipefail
          mapfile -t parts < <(grep -Ev '^[[:space:]]*(#|$)' payload/parts.txt)
          test "${#parts[@]}" -eq 7
          for index in "${!parts[@]}"; do
            printf -v expected 'payload/%s.b64.part-%03d' "$ARCHIVE_NAME" "$index"
            test "${parts[$index]}" = "$expected"
            test -s "${parts[$index]}"
          done
          rm -rf /tmp/hermes-v120-rebuild
          mkdir -p /tmp/hermes-v120-rebuild/source
          cat "${parts[@]}" | base64 --decode > "/tmp/hermes-v120-rebuild/$ARCHIVE_NAME"
          (
            cd /tmp/hermes-v120-rebuild
            grep "  $ARCHIVE_NAME$" "$GITHUB_WORKSPACE/SHA256SUMS" | sha256sum --check --strict -
          )
          tar -xzf "/tmp/hermes-v120-rebuild/$ARCHIVE_NAME" -C /tmp/hermes-v120-rebuild/source
          (
            cd /tmp/hermes-v120-rebuild/source/hermes-rebuild-kit
            sha256sum --check --strict MANIFEST.sha256
          )

      - name: Patch clean-host OpenSSL dependency and regression coverage
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/hermes-v120-rebuild/source/hermes-rebuild-kit')
          bootstrap = root / 'bootstrap.sh'
          text = bootstrap.read_text()
          replacements = {
              "if command -v python3 >/dev/null 2>&1 && python3 - <<'PY' >/dev/null 2>&1":
                  "if command -v python3 >/dev/null 2>&1 && command -v openssl >/dev/null 2>&1 && python3 - <<'PY' >/dev/null 2>&1",
              "apt-get install -y --no-install-recommends python3 python3-yaml ca-certificates":
                  "apt-get install -y --no-install-recommends python3 python3-yaml ca-certificates openssl",
              "dnf install -y python3 python3-pyyaml ca-certificates":
                  "dnf install -y python3 python3-pyyaml ca-certificates openssl",
              "yum install -y python3 python3-pyyaml ca-certificates":
                  "yum install -y python3 python3-pyyaml ca-certificates openssl",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one bootstrap match for {old!r}, found {count}')
              text = text.replace(old, new)
          bootstrap.write_text(text)

          regression = root / 'tests' / 'regression_v120_test.py'
          text = regression.read_text()
          marker = '''def test_fedora_dnf5_and_selinux_static_guards() -> None:
          '''
          addition = '''def test_bootstrap_installs_openssl_before_secret_generation() -> None:
              source = (ROOT / "bootstrap.sh").read_text()
              assert "command -v openssl" in source
              assert "python3 python3-yaml ca-certificates openssl" in source
              assert "python3 python3-pyyaml ca-certificates openssl" in source


          '''
          if addition not in text:
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'expected one regression insertion marker, found {count}')
              text = text.replace(marker, addition + marker)
              regression.write_text(text)
          PY

      - name: Regenerate manifest and run complete test suite
        run: |
          set -Eeuo pipefail
          kit=/tmp/hermes-v120-rebuild/source/hermes-rebuild-kit
          (
            cd "$kit"
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type f ! -name MANIFEST.sha256 -printf '%P\0' \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > MANIFEST.sha256
            sha256sum --check --strict MANIFEST.sha256
            bash -n install.sh bootstrap.sh bin/hermes-rebuildctl tests/run.sh
            sudo env PYTHONPYCACHEPREFIX=/tmp/hermes-v120-pyc python3 -m compileall -q bin tests
            sudo ./tests/run.sh
          )

      - name: Deterministically rebuild and split archive
        run: |
          set -Eeuo pipefail
          work=/tmp/hermes-v120-rebuild
          rm -rf "$work/payload"
          mkdir -p "$work/payload"
          (
            cd "$work/source"
            tar \
              --sort=name \
              --mtime="$FIXED_MTIME" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --format=gnu \
              -cf - hermes-rebuild-kit \
              | gzip -n -9 > "$work/$ARCHIVE_NAME.new"
          )
          actual="$(sha256sum "$work/$ARCHIVE_NAME.new" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_NEW_SHA256"

          base64 -w0 "$work/$ARCHIVE_NAME.new" > "$work/$ARCHIVE_NAME.b64"
          split -b 10000 -d -a 3 \
            "$work/$ARCHIVE_NAME.b64" \
            "$work/payload/$ARCHIVE_NAME.b64.part-"
          test "$(find "$work/payload" -maxdepth 1 -type f | wc -l)" -eq 7
          for index in $(seq 0 6); do
            printf -v part '%s/payload/%s.b64.part-%03d' "$work" "$ARCHIVE_NAME" "$index"
            test -s "$part"
          done

          cat "$work"/payload/*.part-* | base64 --decode > "$work/reconstructed.tar.gz"
          cmp "$work/$ARCHIVE_NAME.new" "$work/reconstructed.tar.gz"
          test "$(sha256sum "$work/reconstructed.tar.gz" | awk '{print $1}')" = "$EXPECTED_NEW_SHA256"

          rm -rf "$work/verify"
          mkdir -p "$work/verify"
          tar -xzf "$work/reconstructed.tar.gz" -C "$work/verify"
          (
            cd "$work/verify/hermes-rebuild-kit"
            sha256sum --check --strict MANIFEST.sha256
            sudo ./tests/run.sh
          )

      - name: Publish checksum and seven parts in one commit
        run: |
          set -Eeuo pipefail
          work=/tmp/hermes-v120-rebuild
          printf '%s  %s\n' "$EXPECTED_NEW_SHA256" "$ARCHIVE_NAME" > SHA256SUMS
          rm -f payload/$ARCHIVE_NAME.b64.part-*
          cp "$work"/payload/$ARCHIVE_NAME.b64.part-* payload/

          mapfile -t parts < <(grep -Ev '^[[:space:]]*(#|$)' payload/parts.txt)
          test "${#parts[@]}" -eq 7
          for index in "${!parts[@]}"; do
            printf -v expected 'payload/%s.b64.part-%03d' "$ARCHIVE_NAME" "$index"
            test "${parts[$index]}" = "$expected"
            test -s "${parts[$index]}"
          done
          cat "${parts[@]}" | base64 --decode > /tmp/published-reconstruction.tar.gz
          test "$(sha256sum /tmp/published-reconstruction.tar.gz | awk '{print $1}')" = "$EXPECTED_NEW_SHA256"

          git config user.name 'Hermes Recovery CI'
          git config user.email 'actions@users.noreply.github.com'
          git add SHA256SUMS payload/$ARCHIVE_NAME.b64.part-*
          git diff --cached --check
          git commit -m 'fix: install OpenSSL before secret generation'
          git push origin "HEAD:$RELEASE_BRANCH"
