name: v1.2.0 rebuild payload with SSH host-key fix v2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v120-rebuild-ssh-hostkeys-v2.yml'

permissions:
  contents: write

concurrency:
  group: v120-ssh-hostkey-release-rebuild-v2
  cancel-in-progress: false

env:
  RELEASE_BRANCH: agent/bitwarden-smart-resume-v1.2.0-final
  ARCHIVE_NAME: hermes-rebuild-kit-v1.2.0.tar.gz

jobs:
  rebuild:
    name: Patch, test, sign and publish SSH host-key fix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Install test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Rebuild and atomically publish verified payload
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          trap 'sudo rm -rf "$work"' EXIT
          mkdir -p "$work/source" "$work/payload" "$work/pycache"

          mapfile -t parts < <(grep -Ev '^[[:space:]]*(#|$)' payload/parts.txt)
          test "${#parts[@]}" -eq 7
          for index in "${!parts[@]}"; do
            printf -v expected 'payload/%s.b64.part-%03d' "$ARCHIVE_NAME" "$index"
            test "${parts[$index]}" = "$expected"
            test -s "${parts[$index]}"
          done

          cat "${parts[@]}" | base64 --decode > "$work/current.tar.gz"
          (
            cd "$work"
            grep "  $ARCHIVE_NAME$" "$GITHUB_WORKSPACE/SHA256SUMS" \
              | sed "s#  $ARCHIVE_NAME#  current.tar.gz#" \
              | sha256sum --check --strict -
          )
          tar -xzf "$work/current.tar.gz" -C "$work/source"
          kit="$work/source/hermes-rebuild-kit"
          (
            cd "$kit"
            sha256sum --check --strict MANIFEST.sha256
          )

          python3 - "$kit" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          controller = root / "bin" / "hermes_rebuild.py"
          source = controller.read_text()
          needle = '        verify = ctx.runner.run(["sshd", "-t"], check=False, capture=True, quiet=True)\n'
          insertion = (
              '        # Minimal/image Fedora installs may not create SSH host keys.\n'
              '        # `ssh-keygen -A` creates only missing keys and preserves existing keys.\n'
              '        ctx.runner.run(["ssh-keygen", "-A"])\n'
              + needle
          )
          if source.count(needle) != 1:
              raise SystemExit("unexpected sshd validation line count")
          controller.write_text(source.replace(needle, insertion))

          regression = root / "tests" / "regression_v120_test.py"
          source = regression.read_text()
          marker = "def test_fedora_dnf5_and_selinux_static_guards() -> None:\n"
          addition = '''def test_openssh_generates_missing_host_keys_before_validation() -> None:
              source = (ROOT / "bin/hermes_rebuild.py").read_text()
              start = source.index("def install_openssh")
              end = source.index("def _tailscale_connected", start)
              body = source[start:end]
              generate = 'ctx.runner.run(["ssh-keygen", "-A"])'
              validate = 'ctx.runner.run(["sshd", "-t"]'
              assert generate in body
              assert validate in body
              assert body.index(generate) < body.index(validate)


          '''
          if source.count(marker) != 1:
              raise SystemExit("unexpected regression insertion marker")
          source = source.replace(marker, addition + marker)

          call = "    test_bootstrap_unprivileged_test_mode_is_plan_only()\n"
          if source.count(call) != 1:
              raise SystemExit("unexpected regression main call marker")
          source = source.replace(
              call,
              call + "    test_openssh_generates_missing_host_keys_before_validation()\n",
          )
          regression.write_text(source)
          PY

          (
            cd "$kit"
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type f ! -name MANIFEST.sha256 -printf '%P\0' \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > MANIFEST.sha256
            sha256sum --check --strict MANIFEST.sha256
            bash -n install.sh bootstrap.sh bin/hermes-rebuildctl tests/run.sh
            sudo env \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPYCACHEPREFIX="$work/pycache" \
              ./tests/run.sh
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            sha256sum --check --strict MANIFEST.sha256
            for executable in \
              install.sh bootstrap.sh bin/hermes-rebuildctl bin/hermes_rebuild.py \
              tests/run.sh tests/smoke_test.py tests/e2e_test.py tests/regression_v120_test.py; do
              test "$(stat -c '%a' "$executable")" = 755
            done
          )

          (
            cd "$work/source"
            tar \
              --sort=name \
              --mtime='2026-08-05 00:00:00Z' \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --format=gnu \
              -cf "$work/release.tar" hermes-rebuild-kit
          )
          gzip -n -9 -c "$work/release.tar" > "$work/$ARCHIVE_NAME"
          archive_sha="$(sha256sum "$work/$ARCHIVE_NAME" | awk '{print $1}')"
          printf 'published archive SHA-256: %s\n' "$archive_sha"

          base64 -w0 "$work/$ARCHIVE_NAME" > "$work/$ARCHIVE_NAME.b64"
          split -b 10000 -d -a 3 \
            "$work/$ARCHIVE_NAME.b64" \
            "$work/payload/$ARCHIVE_NAME.b64.part-"
          test "$(find "$work/payload" -maxdepth 1 -type f | wc -l)" -eq 7
          cat "$work"/payload/*.part-* | base64 --decode > "$work/reconstructed.tar.gz"
          cmp "$work/$ARCHIVE_NAME" "$work/reconstructed.tar.gz"
          test "$(sha256sum "$work/reconstructed.tar.gz" | awk '{print $1}')" = "$archive_sha"

          rm -rf "$work/verify"
          mkdir -p "$work/verify"
          tar -xzf "$work/reconstructed.tar.gz" -C "$work/verify"
          (
            cd "$work/verify/hermes-rebuild-kit"
            sha256sum --check --strict MANIFEST.sha256
            sudo env \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPYCACHEPREFIX="$work/verify-pycache" \
              ./tests/run.sh
          )

          printf '%s  %s\n' "$archive_sha" "$ARCHIVE_NAME" > SHA256SUMS
          rm -f payload/$ARCHIVE_NAME.b64.part-*
          cp "$work"/payload/$ARCHIVE_NAME.b64.part-* payload/

          cat "${parts[@]}" | base64 --decode > "$work/repo-reconstruction.tar.gz"
          test "$(sha256sum "$work/repo-reconstruction.tar.gz" | awk '{print $1}')" = "$archive_sha"

          git config user.name 'Hermes Recovery CI'
          git config user.email 'actions@users.noreply.github.com'
          git add SHA256SUMS payload/$ARCHIVE_NAME.b64.part-*
          git diff --cached --check
          git commit -m 'fix: generate missing SSH host keys before validation'
          git push origin "HEAD:$RELEASE_BRANCH"
